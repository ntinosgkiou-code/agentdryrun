name: mcp compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        mcp: ["mcp", "mcp<2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: install the official MCP SDK (latest, and the 1.x line)
        run: python -m pip install "${{ matrix.mcp }}"
      - name: mcp-record between the official client and server
        run: python tests/integration/mcp_sdk_check.py
