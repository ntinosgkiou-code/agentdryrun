[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdryrun"
version = "0.7.0"
description = "A dry run for AI coding agents: scan your Claude Code history for what your rules would have stopped, and record any agent's tool calls. Local, read-only, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Security",
]

[project.optional-dependencies]
witness = ["cryptography>=42", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.scripts]
agentdryrun = "agentdryrun.__main__:main"
agentdryrun-verify = "verify:main"

[tool.setuptools]
packages = ["agentdryrun"]
py-modules = ["verify"]

[tool.setuptools.package-data]
agentdryrun = ["packs/*.json"]
