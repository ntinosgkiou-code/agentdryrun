[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdryrun"
version = "0.5.0"
description = "A dry run for AI agents: record their tool calls, see what your rules would have blocked, and prove it later. Local, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Security",
]

[project.optional-dependencies]
witness = ["cryptography>=42", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.scripts]
agentdryrun = "agentdryrun.__main__:main"
agentdryrun-verify = "verify:main"

[tool.setuptools]
packages = ["agentdryrun"]
py-modules = ["verify"]
